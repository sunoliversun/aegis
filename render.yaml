services:
  - type: web
    name: aegis-monitor
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm run build --workspace=packages/db
    startCommand: npx tsx workers/monitor/src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
